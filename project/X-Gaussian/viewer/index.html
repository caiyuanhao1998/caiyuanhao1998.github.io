<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive X-ray Viewer · X-Gaussian</title><meta name="description" content="Explore ray-integrated X-ray views of eight Gaussian-derived CT reconstructions."><link rel="stylesheet" href="viewer.css"><script type="module" src="viewer.js"></script></head><body>
<header><a class="brand" href="../">X-Gaussian</a><span class="divider">/</span><h1>Interactive X-ray Viewer</h1><label class="scene-label" for="scene">Scene</label><select id="scene" aria-label="Scene"></select><button id="download" class="download" type="button">Save image</button></header>
<main><canvas id="view" role="img" aria-label="Interactive X-ray view"></canvas><div class="status-wrap"><p id="status" class="status" role="status">Preparing X-ray view…</p><button id="retry" type="button" hidden onclick="location.reload()">Retry</button></div>
<section class="controls" aria-label="X-ray appearance"><div class="panel-title"><span id="title">CT Volume</span><span class="badge">X-RAY VIEW</span></div><div class="control"><label for="exposure">Exposure<span id="exposure-value" class="value"></span></label><input type="range" id="exposure" min="0.3" max="25" step="0.1"></div><div class="control"><label for="contrast">Contrast<span id="contrast-value" class="value"></span></label><input type="range" id="contrast" min="0.6" max="2.5" step="0.05"></div><div class="control"><label for="structure">Structure window<span id="structure-value" class="value"></span></label><input type="range" id="structure" min="0" max="65" step="0.25"></div><div class="control detail" id="detail-control" hidden><label for="quality">Volume detail</label><select id="quality"><option value="preview">Preview · faster loading</option><option value="native">Native resolution</option></select></div><div class="checks"><label><input type="checkbox" id="invert">Invert</label><label><input type="checkbox" id="cool">Cool tint</label></div><div class="buttons"><button id="rotation" type="button" aria-pressed="true">Pause rotation</button><button id="reset" type="button">Reset view</button></div><p class="volume-info"><span id="resolution"></span> · <a id="field-download" href="#">Native CT field</a></p></section>
<p class="hint">Drag to rotate · Scroll or pinch to zoom · Right-drag to pan</p><p class="caption">Gaussian-derived attenuation · X-ray appearance controls</p></main>
</body></html>
