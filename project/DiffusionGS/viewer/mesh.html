<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exported Mesh · DiffusionGS</title>
  <meta name="description" content="Explore and download the textured meshes exported from DiffusionGS Gaussian point clouds.">
  <link rel="stylesheet" href="mesh.css">
  <script type="module" src="../static/vendor/model-viewer.min.js"></script>
  <script type="module" src="mesh.js?v=elevation10"></script>
</head>
<body>
  <header>
    <a class="brand" href="../index.html">DiffusionGS</a>
    <span class="divider" aria-hidden="true">/</span>
    <h1 id="case-title">Exported Mesh</h1>
    <nav aria-label="Downloads">
      <a id="point-cloud" hidden>View Point Clouds</a>
      <a id="download-glb" class="download" hidden>Download GLB</a>
      <a id="download-obj" hidden>Download OBJ</a>
    </nav>
  </header>
  <main>
    <model-viewer id="mesh" aria-label="Interactive exported object mesh"
      camera-controls auto-rotate rotation-per-second="16deg"
      camera-orbit="-45deg 80deg 160%" field-of-view="35deg"
      min-camera-orbit="auto 5deg 35%" max-camera-orbit="auto 175deg 300%"
      shadow-intensity="1" shadow-softness="0.85" environment-image="neutral"
      exposure="1" interaction-prompt="none" touch-action="pan-y">
      <div slot="progress-bar" id="progress" aria-label="Loading progress"><span></span></div>
    </model-viewer>
    <p id="mesh-status" role="status">Loading mesh…</p>
    <div class="controls" aria-label="Viewer controls">
      <button id="rotation" type="button" aria-pressed="true">Pause rotation</button>
      <button id="reset" type="button">Reset view</button>
    </div>
    <p class="hint">Drag to orbit <span aria-hidden="true">·</span> Scroll or pinch to zoom</p>
  </main>
</body>
</html>
